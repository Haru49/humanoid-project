<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS wireframe v8</title>
<!--
  Wireframe v8 (2026-10-10). Whole app: Monitor / Motion / Logs / Tools.
  New in v8:
  - 3D robot (three.js) with orbit and camera presets FRONT · 3/4 · SIDE · BACK.
    The joint grid order follows which side the camera is on.
  - Camera feed from the XIAO OV3660 (firmware serves one JPEG per GET /jpg).
    Starts automatically on launch with the last address used.
  - Logs page: recorded sessions, summary, shared-cursor charts, export.
  - Tools page: same shell as Motion; rail holds Calibration / Servo scan / IMU zero.
  Tokens: docs/design-system/tokens.md. All robot data is mock.
  Open with ?page=logs / ?page=tools / ?page=motion to land on a page.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..600&family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg:#141110; --sunken:#100e0d; --surface:#1c1816; --line:#2c2622; --line-strong:#40382f;
    --t1:#ede6dc; --t2:#aba196; --t3:#6f665d;
    --accent:#d2b064; --on-accent:#141110; --warn:#e0843c; --fault:#cf4a3f;
    --sans: "Archivo", "IBM Plex Sans JP", "Hiragino Sans", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    --pad-x: 24px; --pad-y: clamp(12px, 2vh, 22px); --row-pad: clamp(7px, 1.3vh, 14px);
    --panel-h: 150px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--t1); font: 400 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  .num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; color: inherit; background: none; border: 0; outline: none; }
  .label { font-family: var(--sans); font-stretch: 112%; font-size: 10.5px; font-weight: 500; letter-spacing: .12em; color: var(--t3); text-transform: uppercase; }
  .meta { font-size: 11px; color: var(--t3); }
  .sq { width: 7px; height: 7px; display: inline-block; flex: none; }

  .app { height: 100vh; display: grid; grid-template-rows: 48px 1fr auto; }
  body.panel-closed { --panel-h: 0px; }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; gap: 28px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .brand { font-stretch: 112%; font-weight: 600; letter-spacing: .26em; font-size: 12px; }
  .nav { display: flex; height: 100%; }
  .nav button { padding: 0 14px; color: var(--t3); border-bottom: 1px solid transparent; font-size: 13px; }
  .nav button:hover { color: var(--t2); }
  .nav button.on { color: var(--t1); border-bottom-color: var(--accent); }
  .sp { flex: 1; }
  .hgroup { display: flex; align-items: center; gap: 14px; height: 100%; }
  .hgroup + .hgroup { border-left: 1px solid var(--line); padding-left: 20px; }
  .src { font-size: 11.5px; color: var(--t2); display: inline-flex; gap: 8px; align-items: center; }
  .sys { font-size: 12px; font-weight: 500; letter-spacing: .12em; display: flex; gap: 8px; align-items: center; }
  .ghost { font-size: 11.5px; color: var(--t2); border: 1px solid var(--line-strong); padding: 5px 12px; letter-spacing: .04em; }
  .ghost:hover { color: var(--t1); border-color: var(--t3); }
  .primary { font-size: 11.5px; padding: 6px 14px; background: var(--accent); color: var(--on-accent); font-weight: 500; letter-spacing: .04em; border: 1px solid var(--accent); }
  .primary.on { background: none; border-color: var(--line-strong); color: var(--t2); font-weight: 400; }

  /* ---------- operating shell (monitor / motion / tools) ---------- */
  .main { display: grid; grid-template-columns: minmax(300px, 0.85fr) minmax(560px, 1.15fr); min-height: 0; }
  body.with-rail .main { grid-template-columns: 232px minmax(260px, 0.85fr) minmax(540px, 1.15fr); }
  body.page-logs .main { display: none; }
  .col { min-height: 0; overflow: hidden; }
  .col + .col { border-left: 1px solid var(--line); }
  .sec { padding: var(--pad-y) var(--pad-x); }
  .sec + .sec { border-top: 1px solid var(--line); }
  .sechead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: clamp(8px, 1.4vh, 16px); gap: 12px; }

  /* left column: camera over robot */
  .stage { display: grid; grid-template-rows: auto 1fr; }
  .cam { container-type: inline-size; }
  .camrow { display: grid; grid-template-columns: auto 1fr; gap: 20px; }
  .caminfo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .caminfo .label { margin-bottom: 4px; }
  .kv { display: flex; justify-content: space-between; font-size: 11px; color: var(--t3); border-top: 1px solid var(--line); padding-top: 5px; }
  .kv span:last-child { color: var(--t2); }
  .camtools { display: flex; gap: 14px; align-items: baseline; font-size: 11px; color: var(--t3); margin-top: auto; }
  .camtools button:hover { color: var(--t1); }
  .camaddr { font: 12px var(--mono); color: var(--t1); width: 100%; padding-bottom: 4px; margin-bottom: 4px; border-bottom: 1px solid var(--line-strong) !important; border-bottom: 1px solid transparent; }
  .camaddr:hover, .camaddr:focus { border-bottom-color: var(--line-strong); }
  .frame { position: relative; width: min(62cqw, calc(25vh * 4 / 3)); aspect-ratio: 4 / 3; background: var(--sunken); border: 1px solid var(--line); }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .frame .nosig { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 6px; }
  .frame .nosig .mono { font-size: 11px; color: var(--t3); }
  .frame.live .nosig { display: none; }
  .frame:not(.live) img { visibility: hidden; }
  .frame .rec { position: absolute; left: 10px; top: 8px; font: 10.5px var(--mono); color: var(--t1); display: none; gap: 6px; align-items: center; }
  .frame.live .rec { display: inline-flex; }
  .frame.paused .rec { color: var(--t3); }

  .robot { position: relative; min-height: 0; border-top: 1px solid var(--line); }
  .robot .tl { position: absolute; top: 14px; left: 24px; z-index: 2; }
  .seg { position: absolute; top: 9px; right: 20px; display: flex; border: 1px solid var(--line-strong); z-index: 2; }
  .seg button { font-size: 10.5px; letter-spacing: .1em; padding: 4px 9px; color: var(--t3); font-weight: 500; }
  .seg button.on { background: var(--surface); color: var(--t1); }
  .robot .hint { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--t3); z-index: 2; pointer-events: none; }
  #robot3d { position: absolute; inset: 0; }
  #robot3d canvas { display: block; }
  .labels { position: absolute; inset: 0; }
  .j3l { font: 10px var(--mono); color: var(--t3); pointer-events: none; }
  .gl3 { font: 10px var(--mono); color: var(--t3); pointer-events: none; }

  /* data column */
  .data { display: grid; grid-template-rows: auto 1fr; }
  .legs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
  .leghead { padding-bottom: 8px; }
  .colhead { display: grid; grid-template-columns: 1.2fr 1fr 1fr; padding: 0 10px 6px 12px; }
  .colhead span { font-size: 10px; letter-spacing: .1em; color: var(--t3); text-transform: uppercase; text-align: right; }
  .colhead span:first-child { text-align: left; }
  .jb { padding: var(--row-pad) 0 var(--row-pad) 12px; border-top: 1px solid var(--line); cursor: pointer; position: relative; transition: background-color .12s; }
  .jb:hover, .jb.sel { background: var(--surface); }
  .jb.sel::before { content: ""; position: absolute; left: 0; top: -1px; bottom: 0; width: 2px; background: var(--accent); }
  .jb.sel.enter::before { transform-origin: top; animation: drawbar .18s ease-out; }
  .jb .row1 { display: flex; justify-content: space-between; align-items: baseline; padding-right: 10px; }
  .jb .nm { font-size: 12.5px; color: var(--t2); }
  .jb .nm .id { font-family: var(--mono); color: var(--t3); margin-right: 8px; font-size: 11.5px; }
  .st { font-size: 10.5px; font-weight: 500; letter-spacing: .08em; display: inline-flex; gap: 6px; align-items: center; color: var(--t3); }
  .st .sq { width: 6px; height: 6px; }
  .vals { display: grid; grid-template-columns: 1.2fr 1fr 1fr; margin-top: 4px; padding-right: 10px; }
  .vals span { font-size: 17px; text-align: right; }
  .vals span:first-child { text-align: left; }
  small.u { font-size: 10.5px; color: var(--t3); margin-left: 3px; }
  .dim { color: var(--t3); }
  .busrow { display: grid; grid-template-columns: auto auto 1fr; gap: 16px; align-items: center; margin-top: clamp(8px, 1.4vh, 14px); padding-top: clamp(8px, 1.4vh, 14px); border-top: 1px solid var(--line); }
  .busrow .v { font-size: 15px; }
  .busrow svg { width: 100%; height: 22px; }

  .imu { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .imu-body { display: grid; grid-template-columns: auto 1fr; gap: clamp(16px, 2.4vw, 36px); align-items: center; min-height: 0; }
  .gauge { width: clamp(88px, 15vh, 160px); height: auto; }
  .axes { display: grid; grid-template-rows: repeat(3, minmax(30px, 1fr)); height: 100%; max-height: 210px; }
  .axis { display: grid; grid-template-columns: 52px 1fr 84px; gap: 12px; align-items: center; border-top: 1px solid var(--line); cursor: crosshair; }
  .axis:first-child { border-top: 0; }
  .axis .k { color: var(--t2); font-size: 12px; }
  .axis .v { font-size: 19px; text-align: right; }
  .axis svg { width: 100%; height: 24px; }
  .axis.scrub .v { color: var(--t2); }
  .axis.scrub .k { color: var(--accent); font-family: var(--mono); font-size: 11px; }

  /* ---------- rail (motion / tools) ---------- */
  .rail { display: none; flex-direction: column; }
  body.with-rail .rail { display: flex; }
  .rail .sec { padding: 16px; }
  .list button { display: block; width: 100%; text-align: left; padding: 8px 10px; color: var(--t2); border-left: 2px solid transparent; font-size: 13px; }
  .list button:hover { color: var(--t1); }
  .list button.on { color: var(--t1); border-left-color: var(--accent); background: var(--surface); }
  .stateline { font: 11.5px var(--mono); color: var(--t2); }
  .acts { display: flex; flex-direction: column; gap: 8px; }
  .act { border: 1px solid var(--line-strong); padding: 12px; text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13.5px; }
  .act:hover:not(:disabled) { border-color: var(--accent); }
  .act:disabled { color: var(--t3); cursor: not-allowed; }
  .act .why { font-size: 10.5px; color: var(--t3); }
  .act.running { border-color: var(--accent); color: var(--accent); }
  .nudge { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .nudge .act { justify-content: center; padding: 10px 0; font: 12.5px var(--mono); }
  .bigpos { font-size: 28px; font-weight: 300; margin: 2px 0 12px; }
  .rec-list { font: 12px var(--mono); }
  .rec-list div { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--line); color: var(--t2); }
  .scanres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font: 12px var(--mono); }
  .scanres span { border: 1px solid var(--line); padding: 8px; display: flex; justify-content: space-between; color: var(--t2); }
  .scanres span.bad { color: var(--fault); border-color: var(--fault); }
  .stop { margin: auto 16px 16px; padding: 16px; background: var(--fault); color: var(--bg); font-weight: 600; letter-spacing: .2em; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .stop kbd { font: 10.5px var(--mono); opacity: .7; letter-spacing: 0; }
  .railpage { display: none; flex-direction: column; flex: 1; min-height: 0; overflow: auto; }
  body.page-motion .railpage.motion, body.page-tools .railpage.tools { display: flex; }

  /* ---------- logs page ---------- */
  .logs { display: none; grid-template-columns: 300px 1fr; min-height: 0; }
  body.page-logs .logs { display: grid; }
  .sessions { border-right: 1px solid var(--line); overflow: auto; }
  .sessions .sec { padding: var(--pad-y) 20px; }
  .sess { display: block; width: 100%; text-align: left; padding: 12px 20px; border-top: 1px solid var(--line); border-left: 2px solid transparent; }
  .sess:hover { background: var(--surface); }
  .sess.on { background: var(--surface); border-left-color: var(--accent); }
  .sess .d { font: 11px var(--mono); color: var(--t3); display: flex; justify-content: space-between; }
  .sess .t { font-size: 13.5px; color: var(--t1); margin: 3px 0 2px; }
  .sess .s { font-size: 11px; color: var(--t3); display: flex; gap: 12px; }
  .detail { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; overflow: hidden; }
  .dhead { display: flex; align-items: flex-end; gap: 16px; padding: var(--pad-y) var(--pad-x); border-bottom: 1px solid var(--line); }
  .dhead h2 { font-weight: 400; font-size: 22px; letter-spacing: -.005em; }
  .dhead .mono { font-size: 11.5px; color: var(--t3); margin-top: 4px; }
  .stats { display: grid; grid-template-columns: repeat(6, 1fr); border-bottom: 1px solid var(--line); }
  .stat { padding: 14px var(--pad-x); }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .v { font-size: 20px; margin-top: 4px; }
  .charts { position: relative; padding: 8px var(--pad-x) 16px; overflow: auto; }
  .lane, .chart { display: grid; grid-template-columns: 120px 1fr 96px; gap: 16px; align-items: center; }
  .lane { height: 34px; border-bottom: 1px solid var(--line); }
  .chart { height: clamp(52px, 9vh, 92px); border-bottom: 1px solid var(--line); }
  .chart .k { font-size: 12px; color: var(--t2); }
  .chart .k small { display: block; font: 10.5px var(--mono); color: var(--t3); }
  .chart svg, .lane .track { width: 100%; height: 70%; display: block; }
  .chart .v { text-align: right; font-size: 15px; }
  .lane .track { position: relative; height: 14px; }
  .evmark { position: absolute; top: 0; width: 2px; height: 14px; transform: translateX(-1px); }
  .plot { position: relative; height: 100%; display: flex; align-items: center; cursor: crosshair; }
  .cursor { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--t2); pointer-events: none; display: none; }
  .charts.hovering .cursor { display: block; }
  .tread { font: 11px var(--mono); color: var(--t3); }
  .charts.hovering .tread { color: var(--accent); }
  .axisrow { display: grid; grid-template-columns: 120px 1fr 96px; gap: 16px; font: 10.5px var(--mono); color: var(--t3); padding-top: 6px; }
  .axisrow .ticks { display: flex; justify-content: space-between; }

  /* ---------- bottom panel ---------- */
  .panel { height: calc(var(--panel-h) + 34px); border-top: 1px solid var(--line); background: var(--sunken); display: grid; grid-template-rows: 34px 1fr; position: relative; }
  .grip { position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: ns-resize; }
  .ptabs { display: flex; align-items: stretch; padding: 0 16px 0 10px; border-bottom: 1px solid var(--line); }
  .ptabs .tab { padding: 0 12px; border-bottom: 1px solid transparent; }
  .ptabs .tab.on { color: var(--t1); border-bottom-color: var(--t2); }
  .ptabs .tools { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 11.5px; color: var(--t3); }
  .ptabs .tools button:hover { color: var(--t1); }
  .stream { overflow: auto; padding: 6px 24px 10px; font: 12px/1.7 var(--mono); }
  body.panel-closed .stream { display: none; }
  .ln { display: grid; grid-template-columns: 72px 56px 1fr; gap: 12px; white-space: nowrap; }
  .ln .t, .ln .lv { color: var(--t3); }
  .ln .m { color: var(--t2); overflow: hidden; text-overflow: ellipsis; }
  .ln.raw .m { color: var(--t3); }

  [data-copy] { cursor: copy; }
  [data-copy]:hover { color: var(--accent) !important; }
  .toast { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); background: var(--t1); color: var(--bg); font: 11.5px var(--mono); padding: 5px 12px; opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: 1; }

  /* ---------- finishing ---------- */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 20; opacity: .05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
  @keyframes settle { from { color: var(--accent); } to { color: inherit; } }
  .chg { animation: settle .9s ease-out; }
  @keyframes breathe { 50% { opacity: .35; } }
  .sq.live { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes drawbar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes arrive { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .ln.new { animation: arrive .22s ease-out; }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body class="page-monitor">
<div class="app">
  <header class="top">
    <span class="brand">NEXUS</span>
    <nav class="nav" id="nav">
      <button data-page="monitor">Monitor</button>
      <button data-page="motion">Motion</button>
      <button data-page="logs">Logs</button>
      <button data-page="tools">Tools</button>
    </nav>
    <span class="sp"></span>
    <div class="hgroup"><button class="ghost" id="copyall">Copy all</button></div>
    <div class="hgroup">
      <span class="src"><i class="sq" id="portdot" style="background:var(--t3)"></i><span id="src" class="mono">MOCK</span></span>
      <button class="primary" id="connect">Connect ESP32</button>
    </div>
    <div class="hgroup"><span class="sys" id="sys" style="color:var(--fault)"><i class="sq" style="background:var(--fault)"></i>ERROR</span></div>
  </header>

  <!-- ===== operating shell ===== -->
  <main class="main">
    <aside class="col rail">
      <!-- Motion -->
      <div class="railpage motion">
        <div class="sec">
          <div class="label" style="margin-bottom:12px">Motion</div>
          <div class="list" id="prog">
            <button class="on" data-p="squat">屈伸</button>
            <button data-p="left">左脚 平面リンク</button>
            <button data-p="right">右脚 平面リンク</button>
          </div>
        </div>
        <div class="sec"><div class="stateline" id="mstate"></div></div>
        <div class="sec"><div class="acts" id="acts"></div></div>
      </div>
      <!-- Tools -->
      <div class="railpage tools">
        <div class="sec">
          <div class="label" style="margin-bottom:12px">Tools</div>
          <div class="list" id="toollist">
            <button class="on" data-t="calib">キャリブレーション</button>
            <button data-t="scan">サーボスキャン</button>
            <button data-t="imu">IMU ゼロ点</button>
          </div>
        </div>
        <div id="toolbody" style="display:flex;flex-direction:column"></div>
      </div>
      <button class="stop" id="stop">STOP <kbd>esc</kbd></button>
    </aside>

    <section class="col stage">
      <div class="sec cam">
        <div class="camrow">
          <div class="frame" id="frame">
            <img id="camimg" alt="">
            <span class="rec"><i class="sq live" style="background:var(--t1);width:6px;height:6px"></i><span id="camstate">LIVE</span></span>
            <div class="nosig"><span class="label">No signal</span><span class="mono" id="camhint">set the address →</span></div>
          </div>
          <div class="caminfo">
            <span class="label">Camera</span>
            <input class="camaddr" id="camaddr" placeholder="192.168.x.x" spellcheck="false" title="Camera address — Enter to connect">
            <div class="kv mono"><span>rate</span><span id="camfps">—</span></div>
            <div class="kv mono"><span>latency</span><span id="camlat">—</span></div>
            <div class="kv mono"><span>frame</span><span>320×240</span></div>
            <div class="kv mono"><span>sensor</span><span>OV3660</span></div>
            <div class="camtools"><button id="campause">pause</button><button id="camopen">open</button></div>
          </div>
        </div>
      </div>
      <div class="robot">
        <span class="label tl">Robot</span>
        <div class="seg" id="views">
          <button class="on" data-v="front">FRONT</button><button data-v="q">3/4</button><button data-v="side">SIDE</button><button data-v="back">BACK</button>
        </div>
        <div id="robot3d"></div>
        <span class="hint">drag to orbit · scroll to zoom</span>
      </div>
    </section>

    <section class="col data">
      <div class="sec">
        <div class="sechead"><span class="label">Joints</span><span class="meta mono">scan 2.0 s</span></div>
        <div class="legs" id="legs"></div>
        <div class="busrow">
          <span class="label">Bus</span>
          <span class="v num" data-copy="bus 7.38 V">7.38<small class="u">V</small></span>

            <circle cx="74" cy="74" r="72" fill="none" stroke="var(--line-strong)"/>
            <circle cx="74" cy="74" r="48" fill="none" stroke="var(--line)"/>
            <circle cx="74" cy="74" r="24" fill="none" stroke="var(--line)"/>
            <line x1="2" y1="74" x2="146" y2="74" stroke="var(--line)"/>
            <line x1="74" y1="2" x2="74" y2="146" stroke="var(--line)"/>

  <!-- ===== logs page ===== -->
  <main class="logs">

</div>
<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const now = () => new Date().toTimeString().slice(0, 8);
const f1 = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1) + '°';

/* ================= state (mock) ================= */
const C = { ok: 'var(--t3)', hot: 'var(--warn)', fault: 'var(--fault)', idle: 'var(--t3)' };
const label = { ok: 'OK', hot: 'HOT', fault: 'NO REPLY', idle: 'IDLE' };
const joints = [
  { id: 11, leg: 'L', name: 'Yaw',   pos: 2048, v: 7.4, c: 34, st: 'ok' },
  { id: 12, leg: 'L', name: 'Upper', pos: 1873, v: 7.4, c: 36, st: 'ok' },
  { id: 13, leg: 'L', name: 'Knee',  pos: 2311, v: 7.3, c: 58, st: 'hot' },
  { id: 21, leg: 'R', name: 'Yaw',   pos: 2050, v: 7.4, c: 33, st: 'ok' },
  { id: 22, leg: 'R', name: 'Upper', pos: null, v: null, c: null, st: 'fault' },
  { id: 23, leg: 'R', name: 'Knee',  pos: 1790, v: 7.4, c: 35, st: 'idle' },
];
const canon = j => `${j.leg === 'L' ? 'LEFT' : 'RIGHT'}_${{ Yaw: 'YAW', Upper: 'PLANAR_UPPER', Knee: 'PLANAR_KNEE' }[j.name]}`;
const imu = { roll: 2.1, pitch: -0.4, yaw: 12.0 }, imuZero = { roll: 0, pitch: 0 };
const att = k => imu[k] - (imuZero[k] || 0);
let selected = 12, frontSide = true;
const order = () => frontSide ? ['R', 'L'] : ['L', 'R'];

/* ================= joints ================= */
const prevVals = {}; let drawnSel = null;
function renderJoints() {
  const val = (j, x, u, warn) => {
    const key = j.id + '/' + u, changed = key in prevVals && prevVals[key] !== x; prevVals[key] = x;
    return x == null ? '<span class="dim num">—</span>'
      : `<span class="num${changed ? ' chg' : ''}" data-copy="ID ${j.id} ${x}${u ? ' ' + u : ''}" ${warn ? 'style="color:var(--warn)"' : ''}>${x}${u ? `<small class="u">${u}</small>` : ''}</span>`;
  };
  $('legs').innerHTML = order().map(leg => `
    <div>
      <div class="leghead"><span class="label" style="color:var(--t2)">${leg === 'L' ? 'Left leg' : 'Right leg'}</span></div>
      <div class="colhead"><span>pos</span><span>volt</span><span>temp</span></div>
      ${joints.filter(j => j.leg === leg).map(j => `
        <div class="jb ${j.id === selected ? 'sel' + (drawnSel !== selected ? ' enter' : '') : ''}" data-id="${j.id}">
          <div class="row1"><span class="nm"><span class="id">${j.id}</span>${j.name}</span>
            <span class="st" style="color:${C[j.st]}"><i class="sq" style="background:${C[j.st]}"></i>${label[j.st]}</span></div>
          <div class="vals">${val(j, j.pos, '')}${val(j, j.v, 'V')}${val(j, j.c, '°C', j.st === 'hot')}</div>
        </div>`).join('')}
    </div>`).join('');
  drawnSel = selected;
}

/* ================= IMU ================= */
const hist = { roll: [], pitch: [], yaw: [] };
for (let i = 0; i < 60; i++) { hist.roll.push(2 + Math.sin(i / 6) * .6); hist.pitch.push(-.4 + Math.cos(i / 5) * .4); hist.yaw.push(12 + Math.sin(i / 9) * .3); }
const spark = (arr, lo, hi, off = 0) => arr.map((v, i) => `${(i / 59 * 200).toFixed(1)},${(23 - (v - off - lo) / (hi - lo) * 22).toFixed(1)}`).join(' ');
let scrub = null;
function renderImu() {
  $('axes').innerHTML = ['roll', 'pitch', 'yaw'].map(k => {
    const off = imuZero[k] || 0;
    const [lo, hi] = k === 'yaw' ? [imu.yaw - 4, imu.yaw + 4] : [-6, 6];
    const sc = scrub && scrub.k === k, i = sc ? scrub.i : 59, v = (hist[k][i] ?? imu[k]) - off, x = (i / 59 * 200).toFixed(1);
    return `<div class="axis${sc ? ' scrub' : ''}" data-k="${k}"><span class="k">${sc ? '−' + ((59 - i) * .5).toFixed(1) + ' s' : k[0].toUpperCase() + k.slice(1)}</span>
      <svg viewBox="0 0 200 24" preserveAspectRatio="none"><line x1="0" y1="12" x2="200" y2="12" stroke="var(--line)" stroke-dasharray="2 3"/><polyline fill="none" stroke="var(--accent)" stroke-width="1.2" points="${spark(hist[k], lo, hi, k === 'yaw' ? 0 : off)}"/>${sc ? `<line x1="${x}" y1="0" x2="${x}" y2="24" stroke="var(--t2)" vector-effect="non-scaling-stroke"/>` : ''}</svg>
      <span class="v num" data-copy="${k} ${f1(v)}">${f1(v)}</span></div>`;
  }).join('');
  const b = $('bubble');
  b.setAttribute('cx', 74 + (frontSide ? -1 : 1) * att('roll') * 5);
  b.setAttribute('cy', 74 - att('pitch') * 5);
}
$('axes').addEventListener('mousemove', e => {
  const a = e.target.closest('.axis'), svg = a && a.querySelector('svg'); if (!svg) return;
  const r = svg.getBoundingClientRect(), f = (e.clientX - r.left) / r.width;
  scrub = f < 0 || f > 1 ? null : { k: a.dataset.k, i: Math.round(f * 59) }; renderImu();
});
$('axes').addEventListener('mouseleave', () => { scrub = null; renderImu(); });

/* ================= 3D robot ================= */
const host = $('robot3d');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
host.appendChild(renderer.domElement);
const labels = new CSS2DRenderer(); labels.domElement.className = 'labels'; host.appendChild(labels.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(26, 1, 1, 1000);
const controls = new OrbitControls(cam, labels.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 45; controls.maxDistance = 160;
controls.minPolarAngle = .15; controls.maxPolarAngle = Math.PI / 2 - .02;
controls.target.set(0, 12.5, 0);

scene.add(new THREE.HemisphereLight(0xede6dc, 0x141110, 1.1));
const key = new THREE.DirectionalLight(0xfff4e6, 1.3); key.position.set(25, 45, 40); scene.add(key);
const grid = new THREE.GridHelper(48, 12, 0x40382f, 0x2c2622); scene.add(grid);

const bodyMat = new THREE.MeshLambertMaterial({ color: 0x2b2521 });
const servoMat = new THREE.MeshLambertMaterial({ color: 0x221d1a });
const edgeMat = new THREE.LineBasicMaterial({ color: 0x6f665d });
const tilt = new THREE.Group(); scene.add(tilt);
function part(geo, x, y, z, mat = bodyMat) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), edgeMat));
  tilt.add(m); return m;
}
// Robot faces +z (toward the default camera). Its RIGHT side is −x.
part(new THREE.BoxGeometry(15, 3, 6.5), 0, 25, 0);                // pelvis
part(new THREE.BoxGeometry(5, 1.4, .5), 0, 25, 3.5, servoMat);     // front plate
const markers = {};
const mkLabel = (text, cls) => { const el = document.createElement('span'); el.className = cls; el.textContent = text; return el; };
for (const [side, x] of [['R', -4.8], ['L', 4.8]]) {
  const ids = joints.filter(j => j.leg === side).map(j => j.id);
  part(new THREE.CylinderGeometry(1.7, 1.7, 2.2, 24), x, 22.4, 0, servoMat); // hip yaw servo
  part(new THREE.BoxGeometry(3.2, 3.2, 3.6), x, 19.4, 0, servoMat);          // hip pitch servo
  part(new THREE.BoxGeometry(2.4, 7, 2.4), x, 14.4, 0);                      // upper link
  part(new THREE.BoxGeometry(3.2, 3.2, 3.6), x, 10.6, 0, servoMat);          // knee servo
  part(new THREE.BoxGeometry(2.2, 8, 2.2), x, 5, 0);                          // lower link
  part(new THREE.BoxGeometry(4.2, 1.1, 7.4), x, .55, 1.1);                    // foot, toes toward +z
  part(new THREE.BoxGeometry(4.2, .7, .9), x, .35, 5.2, servoMat);            // toe cap
  [[ids[0], 22.4], [ids[1], 19.4], [ids[2], 10.6]].forEach(([id, y]) => {
    const m = new THREE.Mesh(new THREE.SphereGeometry(.75, 20, 14), new THREE.MeshBasicMaterial({ color: 0xaba196 }));
    m.position.set(x, y, 2.3); m.userData.id = id; tilt.add(m); markers[id] = m;
    const el = mkLabel(id, 'j3l'), lab = new CSS2DObject(el);
    lab.position.set(x + (x < 0 ? -3.6 : 3.6), y, 2.3); tilt.add(lab); m.userData.el = el;
  });
  const g = new CSS2DObject(mkLabel(side, 'gl3')); g.position.set(x, -1.2, 6.5); scene.add(g);
}
function update3d() {
  const acc = css('--accent'), fault = css('--fault'), warn = css('--warn'), neu = css('--t2');
  for (const j of joints) {
    const m = markers[j.id], s = j.id === selected;
    m.material.color.set(s ? acc : j.st === 'fault' ? fault : j.st === 'hot' ? warn : neu);
    m.scale.setScalar(s ? 1.5 : 1);
    m.userData.el.style.color = s ? 'var(--accent)' : j.st === 'fault' ? 'var(--fault)' : 'var(--t3)';
  }
  tilt.rotation.z = -att('roll') * Math.PI / 180;
  tilt.rotation.x = att('pitch') * Math.PI / 180;
}
const presets = {
  front: [0, 24, 84], q: [56, 30, 60], side: [-84, 18, 0], back: [0, 24, -84],
};
let tween = null;
function goView(name) {
  const from = cam.position.clone(), to = new THREE.Vector3(...presets[name]), t0 = performance.now();
  tween = t => { const k = Math.min(1, (t - t0) / 450), e = 1 - Math.pow(1 - k, 3); cam.position.lerpVectors(from, to, e); if (k === 1) tween = null; };
  document.querySelectorAll('#views button').forEach(b => b.classList.toggle('on', b.dataset.v === name));
}
cam.position.set(...presets.front);
$('views').onclick = e => { const b = e.target.closest('button'); if (b) goView(b.dataset.v); };
controls.addEventListener('start', () => { tween = null; document.querySelectorAll('#views button').forEach(b => b.classList.remove('on')); });

// Click a joint marker to select it (ignore drags).
const ray = new THREE.Raycaster(); let down = null;
labels.domElement.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
labels.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const r = renderer.domElement.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1), cam);
  ray.params.Points = {}; const hit = ray.intersectObjects(Object.values(markers))[0];
  if (hit) select(hit.object.userData.id);
});
function resize() {
  const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h); labels.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host);
function frame(t) {
  if (tween) tween(t);
  controls.update();
  // Joint grid follows the camera: in front of the robot, its right leg is on the left.
  const front = cam.position.z - controls.target.z >= -0.01;
  if (front !== frontSide) { frontSide = front; renderJoints(); renderImu(); }
  renderer.render(scene, cam); labels.render(scene, cam);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function select(id) { selected = id; renderJoints(); update3d(); if (page === 'tools') renderTool(); }
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]'); if (c) return copy(c.dataset.copy);
  const j = e.target.closest('.jb'); if (j) select(+j.dataset.id);
});

/* ================= camera feed =================
 * The camera firmware answers GET /jpg with one JPEG. We request the next
 * frame as soon as one arrives (self-paced), so fps = what the link gives. */
const camState = { url: '', paused: false, live: false, n: 0, t0: 0, timer: null };
try { camState.url = localStorage.getItem('nexus.camAddr') || ''; } catch {}
$('camaddr').value = camState.url;
function camSetLive(live) {
  camState.live = live; $('frame').classList.toggle('live', live);
  if (!live) { $('camfps').textContent = '—'; $('camlat').textContent = '—'; $('camhint').textContent = camState.url ? `waiting for http://${camState.url}/jpg` : 'set the address →'; }
}
function camNext() {
  clearTimeout(camState.timer);
  if (!camState.url || camState.paused) return;
  const img = $('camimg'), started = performance.now();
  camState.timer = setTimeout(() => { camSetLive(false); camState.timer = setTimeout(camNext, 2000); }, 4000);
  img.onload = () => {
    clearTimeout(camState.timer);
    if (!camState.live) { camSetLive(true); camState.n = 0; camState.t0 = performance.now(); log('INFO', `camera live · ${camState.url}`); }
    camState.n++;
    const s = (performance.now() - camState.t0) / 1000;
    if (s > 1) { $('camfps').textContent = `${(camState.n / s).toFixed(1)} fps`; $('camlat').textContent = `${Math.round(performance.now() - started)} ms`; camState.n = 0; camState.t0 = performance.now(); }
    requestAnimationFrame(camNext);
  };
  img.onerror = () => { clearTimeout(camState.timer); if (camState.live) log('WARN', 'camera lost'); camSetLive(false); camState.timer = setTimeout(camNext, 2000); };
  img.src = `http://${camState.url}/jpg?t=${Date.now()}`;
}
$('camaddr').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  camState.url = e.target.value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  try { localStorage.setItem('nexus.camAddr', camState.url); } catch {}
  e.target.blur(); camSetLive(false); camNext();
});
$('camopen').onclick = () => { if (camState.url) open(`http://${camState.url}/jpg`, '_blank'); };
$('campause').onclick = e => {
  camState.paused = !camState.paused; e.target.textContent = camState.paused ? 'resume' : 'pause';
  $('frame').classList.toggle('paused', camState.paused); $('camstate').textContent = camState.paused ? 'PAUSED' : 'LIVE';
  if (!camState.paused) camNext();
};
camSetLive(false); camNext(); // start on launch with the last address

/* ================= bottom panel ================= */
let tab = 'log', paused = false, connected = false;
const logLines = [['14:17:59', 'INFO', 'serial attached'], ['14:18:02', 'INFO', 'scan started'], ['14:31:50', 'WARN', 'ID 13 temp 58 °C'], ['14:32:08', 'ERROR', 'ID 22 no reply']];
const rawLines = [];
const lvColor = { INFO: 'var(--t3)', WARN: 'var(--warn)', ERROR: 'var(--fault)', MOTION: 'var(--accent)' };
const shown = { log: 0, serial: 0 };
function renderStream() {
  const el = $('stream'), atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
  const src = tab === 'log' ? logLines : rawLines, from = shown[tab] && src.length > shown[tab] ? shown[tab] : src.length;
  shown[tab] = src.length;
  el.innerHTML = tab === 'log'
    ? logLines.map(([t, lv, m], n) => `<div class="ln${n >= from ? ' new' : ''}"><span class="t">${t}</span><span class="lv" style="color:${lvColor[lv]}">${lv}</span><span class="m" style="${lv !== 'INFO' ? `color:${lvColor[lv]}` : ''}" data-copy="${t} ${lv} ${m}">${m}</span></div>`).join('')
    : rawLines.map(([t, m], n) => `<div class="ln raw${n >= from ? ' new' : ''}"><span class="t">${t}</span><span class="lv">RX</span><span class="m" data-copy='${m}'>${m}</span></div>`).join('')
      || '<div class="ln raw"><span></span><span></span><span class="m">not connected</span></div>';
  if (atBottom && !paused) el.scrollTop = el.scrollHeight;
}
function log(lv, m) { logLines.push([now(), lv, m]); if (logLines.length > 500) logLines.shift(); renderStream(); }
document.querySelectorAll('.ptabs .tab').forEach(b => b.onclick = () => {
  tab = b.dataset.tab; document.querySelectorAll('.ptabs .tab').forEach(x => x.classList.toggle('on', x === b)); renderStream();
});
$('connect').onclick = e => {
  connected = !connected;
  e.target.textContent = connected ? 'Disconnect' : 'Connect ESP32';
  e.target.classList.toggle('on', connected);
  $('portdot').style.background = connected ? 'var(--t1)' : 'var(--t3)';
  $('portdot').classList.toggle('live', connected);
  $('src').textContent = connected ? 'LIVE · usbmodem1101' : 'MOCK';
  $('portname').textContent = connected ? 'cu.usbmodem1101 · 115200' : 'no port';
  log('INFO', connected ? 'serial attached · cu.usbmodem1101' : 'serial detached');
};
$('pause').onclick = e => { paused = !paused; e.target.textContent = paused ? 'resume' : 'pause'; };
$('clear').onclick = () => { (tab === 'log' ? logLines : rawLines).length = 0; shown[tab] = 0; renderStream(); };
function togglePanel() { document.body.classList.toggle('panel-closed'); $('toggle').textContent = document.body.classList.contains('panel-closed') ? 'show' : 'hide'; }
$('toggle').onclick = togglePanel;
$('grip').onmousedown = e => {
  const y0 = e.clientY, h0 = parseInt(css('--panel-h'));
  const mv = ev => document.documentElement.style.setProperty('--panel-h', Math.max(60, Math.min(innerHeight * .6, h0 + y0 - ev.clientY)) + 'px');
  const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
  addEventListener('mousemove', mv); addEventListener('mouseup', up);
};

/* ================= motion rail ================= */
const programs = {
  squat: { ids: [12, 13, 22, 23], acts: ['しゃがむ', '立つ'] },
  left:  { ids: [12, 13], acts: ['A方向へ', '中立へ'] },
  right: { ids: [22, 23], acts: ['A方向へ', '中立へ'] },
};
let prog = 'squat', running = null;
const blockedBy = ids => { const bad = joints.find(j => j.st === 'fault' && ids.includes(j.id)); return bad ? `ID ${bad.id} 応答なし` : null; };
function renderActs() {
  const p = programs[prog], why = running ? null : blockedBy(p.ids);
  $('mstate').textContent = (running ? 'MOVING' : why ? 'BLOCKED' : 'READY') + ' · ID ' + p.ids.join(' ');
  $('acts').innerHTML = p.acts.map(a => `<button class="act ${running === a ? 'running' : ''}" ${why || running ? 'disabled' : ''} data-a="${a}">${a}${why ? `<span class="why">${why}</span>` : running === a ? '<span class="why">動作中</span>' : ''}</button>`).join('');
}
$('prog').onclick = e => {
  const b = e.target.closest('button'); if (!b || running) return;
  prog = b.dataset.p; document.querySelectorAll('#prog button').forEach(x => x.classList.toggle('on', x === b)); renderActs();
};
$('acts').onclick = e => {
  const b = e.target.closest('.act'); if (!b || b.disabled) return;
  running = b.dataset.a; renderActs(); log('MOTION', `${running} · start`);
  setTimeout(() => { if (running) { log('MOTION', `${running} · done`); running = null; renderActs(); } }, 1800);
};

/* ================= tools rail ================= */
let tool = 'calib', scanning = false, scanResult = null;
const neutrals = [];
function renderTool() {
  const j = joints.find(x => x.id === selected), body = $('toolbody');
  if (tool === 'calib') {
    const why = j.st === 'fault' ? `ID ${j.id} 応答なし` : null;
    body.innerHTML = `
      <div class="sec"><div class="label">Selected joint</div>
        <div class="bigpos num">${j.id} <span style="font-family:var(--sans);font-size:15px;color:var(--t2)">${j.name}</span></div>
        <div class="stateline">pos ${j.pos ?? '—'} · ${why ? 'BLOCKED' : 'READY'}</div></div>
      <div class="sec"><div class="nudge">${[-10, -1, 1, 10].map(d => `<button class="act" data-d="${d}" ${why ? 'disabled' : ''}>${d > 0 ? '+' : '−'}${Math.abs(d)}</button>`).join('')}</div>
        <button class="act" id="setneutral" style="margin-top:8px;width:100%" ${why ? 'disabled' : ''}>この位置を中立にする${why ? `<span class="why">${why}</span>` : ''}</button></div>
      <div class="sec"><div class="label" style="margin-bottom:6px">Recorded neutral</div>
        <div class="rec-list">${neutrals.length ? neutrals.map(n => `<div><span>ID ${n.id}</span><span data-copy="ID ${n.id} neutral ${n.pos}">${n.pos}</span></div>`).join('') : '<div><span class="dim">—</span></div>'}</div></div>`;
    body.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { j.pos += +b.dataset.d; log('MOTION', `ID ${j.id} ${b.textContent} → ${j.pos}`); renderJoints(); renderTool(); });
    const sn = $('setneutral'); if (sn) sn.onclick = () => { const i = neutrals.findIndex(n => n.id === j.id); const rec = { id: j.id, pos: j.pos }; i >= 0 ? neutrals[i] = rec : neutrals.push(rec); log('INFO', `ID ${j.id} neutral = ${j.pos}`); renderTool(); };
  } else if (tool === 'scan') {
    body.innerHTML = `
      <div class="sec"><div class="stateline">${scanning ? 'SCANNING · ID 1–30' : scanResult ? `FOUND ${scanResult.filter(r => r.ok).length} / 6` : 'IDLE'}</div></div>
      <div class="sec"><button class="act ${scanning ? 'running' : ''}" id="doscan" style="width:100%" ${scanning ? 'disabled' : ''}>バスをスキャン${scanning ? '<span class="why">実行中</span>' : ''}</button></div>
      ${scanResult ? `<div class="sec"><div class="scanres">${scanResult.map(r => `<span class="${r.ok ? '' : 'bad'}">${r.id}<span>${r.ok ? 'OK' : '—'}</span></span>`).join('')}</div></div>` : ''}`;
    const b = $('doscan'); if (b) b.onclick = () => { scanning = true; renderTool(); log('INFO', 'bus scan started');
      setTimeout(() => { scanning = false; scanResult = joints.map(x => ({ id: x.id, ok: x.st !== 'fault' })); log('WARN', 'bus scan: ID 22 missing'); renderTool(); }, 1500); };
  } else {
    body.innerHTML = `
      <div class="sec"><div class="stateline">offset roll ${f1(imuZero.roll)} · pitch ${f1(imuZero.pitch)}</div></div>
      <div class="sec" style="display:flex;flex-direction:column;gap:8px">
        <button class="act" id="zero">今の姿勢を水平にする</button>
        <button class="act" id="unzero" ${imuZero.roll || imuZero.pitch ? '' : 'disabled'}>オフセットを消す</button></div>`;
    $('zero').onclick = () => { imuZero.roll = imu.roll; imuZero.pitch = imu.pitch; log('INFO', `IMU zero set · roll ${f1(imu.roll)} pitch ${f1(imu.pitch)}`); renderTool(); renderImu(); update3d(); };
    $('unzero').onclick = () => { imuZero.roll = imuZero.pitch = 0; log('INFO', 'IMU zero cleared'); renderTool(); renderImu(); update3d(); };
  }
}
$('toollist').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  tool = b.dataset.t; document.querySelectorAll('#toollist button').forEach(x => x.classList.toggle('on', x === b)); renderTool();
};
function stop() { running = null; scanning = false; renderActs(); renderTool(); log('ERROR', 'STOP pressed'); }
$('stop').onclick = stop;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.body.classList.contains('with-rail') && document.activeElement.tagName !== 'INPUT') stop();
  if (e.key === '`' && e.ctrlKey) togglePanel();
});

/* ================= logs page ================= */
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const sessions = [
  { id: 's5', date: '2026-10-10', start: '14:17', dur: 891, title: '屈伸 · 支持あり', src: 'device', fw: 'supported-squat', ev: 14, faults: 1, warns: 1 },
  { id: 's4', date: '2026-10-09', start: '21:02', dur: 604, title: 'DC-DC修理後 スモークテスト', src: 'device', fw: 'servo-driver-test', ev: 9, faults: 0, warns: 0 },
  { id: 's3', date: '2026-10-09', start: '19:40', dur: 1220, title: '屈伸 · デバッグ', src: 'device', fw: 'supported-squat', ev: 31, faults: 3, warns: 4 },
  { id: 's2', date: '2026-09-19', start: '16:11', dur: 1505, title: '左平面リンク 再現性', src: 'device', fw: 'phase1-left-planar-imu', ev: 22, faults: 0, warns: 2 },
  { id: 's1', date: '2026-09-18', start: '20:30', dur: 760, title: '手動キャリブレーション', src: 'device', fw: 'servo-calibration', ev: 12, faults: 0, warns: 0 },
];
const N = 240;
function series(s) {
  const r = rng(s.id.charCodeAt(1) * 7919);
  const roll = [], pitch = [], temp = [], bus = [], evs = [];
  let ro = 0, pi = 0, te = 31, bu = 7.45;
  for (let i = 0; i < N; i++) {
    const sq = Math.max(0, Math.sin(i / 18)) ** 2;
    ro += (r() - .5) * .25 - ro * .05; pi += (r() - .5) * .25 - pi * .05;
    roll.push(ro + sq * 2.4); pitch.push(pi - sq * 3.1);
    te += (sq * .18 - (te - 31) * .006) + (r() - .5) * .05; temp.push(te);
    bu += (r() - .5) * .01 - (bu - 7.42) * .05 - sq * .006; bus.push(bu);
  }
  for (let k = 0; k < s.ev; k++) evs.push({ i: Math.floor(r() * N), lv: k < s.faults ? 'ERROR' : k < s.faults + s.warns ? 'WARN' : 'INFO' });
  evs.sort((a, b) => a.i - b.i);
  return { roll, pitch, temp, bus, evs };
}
let sess = sessions[0], data = series(sess);
const mmss = sec => `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
function renderSessions() {
  $('sesscount').textContent = sessions.length;
  $('sesslist').innerHTML = sessions.map(s => `
    <button class="sess ${s === sess ? 'on' : ''}" data-s="${s.id}">
      <div class="d"><span>${s.date} ${s.start}</span><span>${mmss(s.dur)}</span></div>
      <div class="t">${s.title}</div>
      <div class="s"><span>${s.ev} events</span>${s.faults ? `<span style="color:var(--fault)">■ ${s.faults} fault</span>` : ''}${s.warns ? `<span style="color:var(--warn)">■ ${s.warns} warn</span>` : ''}</div>
    </button>`).join('');
}
const max = a => Math.max(...a), min = a => Math.min(...a), absmax = a => Math.max(...a.map(Math.abs));
function summary() {
  return [
    ['Duration', mmss(sess.dur), ''],
    ['Max temp', max(data.temp).toFixed(0) + '<small class="u">°C</small>', max(data.temp) >= 55 ? 'var(--warn)' : ''],
    ['Min bus', min(data.bus).toFixed(2) + '<small class="u">V</small>', ''],
    ['Max |roll|', absmax(data.roll).toFixed(1) + '°', ''],
    ['Max |pitch|', absmax(data.pitch).toFixed(1) + '°', ''],
    ['Faults', String(sess.faults), sess.faults ? 'var(--fault)' : ''],
  ];
}
const chartDefs = [
  { k: 'roll', name: 'Roll', unit: '°', fmt: v => f1(v) },
  { k: 'pitch', name: 'Pitch', unit: '°', fmt: v => f1(v) },
  { k: 'temp', name: 'Temp', sub: 'ID 13', unit: '°C', fmt: v => v.toFixed(1) + ' °C' },
  { k: 'bus', name: 'Bus', unit: 'V', fmt: v => v.toFixed(2) + ' V' },
];
function renderDetail() {
  $('dtitle').textContent = sess.title;
  $('dmeta').textContent = `${sess.date} ${sess.start} · ${mmss(sess.dur)} · ${sess.fw} · ${sess.ev} events`;
  $('stats').innerHTML = summary().map(([k, v, col]) => `<div class="stat"><div class="label">${k}</div><div class="v num" style="${col ? `color:${col}` : ''}">${v}</div></div>`).join('');
  const pts = (arr) => { const lo = min(arr), hi = max(arr), pad = (hi - lo) * .1 || 1; return arr.map((v, i) => `${(i / (N - 1) * 1000).toFixed(1)},${(100 - (v - lo + pad) / (hi - lo + 2 * pad) * 100).toFixed(1)}`).join(' '); };
  $('charts').innerHTML = `
    <div class="lane"><span class="tread" id="tread">${mmss(0)} – ${mmss(sess.dur)}</span>
      <div class="plot"><div class="track">${data.evs.map(e => `<i class="evmark" title="${mmss(e.i / (N - 1) * sess.dur)} ${e.lv}" style="left:${e.i / (N - 1) * 100}%;background:${lvColor[e.lv]}"></i>`).join('')}</div><i class="cursor"></i></div>
      <span class="label" style="text-align:right">events</span></div>
    ${chartDefs.map(c => `
      <div class="chart" data-k="${c.k}"><span class="k">${c.name}${c.sub ? `<small>${c.sub}</small>` : ''}</span>
        <div class="plot"><svg viewBox="0 0 1000 100" preserveAspectRatio="none"><polyline fill="none" stroke="var(--accent)" stroke-width="1.3" vector-effect="non-scaling-stroke" points="${pts(data[c.k])}"/></svg><i class="cursor"></i></div>
        <span class="v num" data-v="${c.k}">${c.fmt(data[c.k][N - 1])}</span></div>`).join('')}
    <div class="axisrow"><span></span><span class="ticks">${[0, .25, .5, .75, 1].map(f => `<span>${mmss(f * sess.dur)}</span>`).join('')}</span><span></span></div>`;
}
$('charts').addEventListener('mousemove', e => {
  const plot = e.target.closest('.plot'); if (!plot) return;
  const r = plot.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), i = Math.round(f * (N - 1));
  $('charts').classList.add('hovering');
  $('charts').querySelectorAll('.cursor').forEach(c => c.style.left = (f * 100) + '%');
  chartDefs.forEach(c => { const el = $('charts').querySelector(`[data-v="${c.k}"]`); el.textContent = c.fmt(data[c.k][i]); el.dataset.copy = `${sess.date} ${sess.start} +${mmss(f * sess.dur)} ${c.k} ${c.fmt(data[c.k][i])}`; });
  $('tread').textContent = '+' + mmss(f * sess.dur);
});
$('charts').addEventListener('mouseleave', () => { $('charts').classList.remove('hovering'); renderDetail(); });
$('sesslist').onclick = e => { const b = e.target.closest('.sess'); if (!b) return; sess = sessions.find(s => s.id === b.dataset.s); data = series(sess); renderSessions(); renderDetail(); };
$('copysum').onclick = () => copy([
  `NEXUS session · ${sess.title}`, `${sess.date} ${sess.start} · ${mmss(sess.dur)} · ${sess.fw}`, '',
  '| metric | value |', '|---|---|', ...summary().map(([k, v]) => `| ${k} | ${v.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim()} |`)
].join('\n'), 'session summary');
$('exportcsv').onclick = () => {
  const rows = ['t_s,roll_deg,pitch_deg,temp13_c,bus_v', ...data.roll.map((_, i) => [(i / (N - 1) * sess.dur).toFixed(2), data.roll[i].toFixed(3), data.pitch[i].toFixed(3), data.temp[i].toFixed(2), data.bus[i].toFixed(3)].join(','))];
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' }));
  a.download = `nexus_${sess.date}_${sess.start.replace(':', '')}.csv`; a.click(); copyToast('exported · ' + a.download);
};

/* ================= navigation, copy ================= */
let page = 'monitor';
function go(p) {
  page = p;
  document.body.className = document.body.className.replace(/\bpage-\w+/g, '').replace(/\bwith-rail\b/g, '').trim() + ` page-${p}` + (p === 'motion' || p === 'tools' ? ' with-rail' : '');
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.page === p));
  if (p === 'tools') renderTool();
  if (p === 'logs') { renderSessions(); renderDetail(); }
  try { history.replaceState(null, '', '?page=' + p); } catch {}
  requestAnimationFrame(resize);
}
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.page); };
$('copyall').onclick = () => copy([
  `NEXUS ${new Date().toISOString().slice(0, 19).replace('T', ' ')} · ${$('src').textContent} · ERROR`,
  `IMU  roll ${f1(att('roll'))}  pitch ${f1(att('pitch'))}  yaw ${f1(imu.yaw)}   bus 7.38 V`, '',
  '| joint | id | pos | V | °C | status |', '|---|---|---|---|---|---|',
  ...joints.map(j => `| ${canon(j)} | ${j.id} | ${j.pos ?? '—'} | ${j.v ?? '—'} | ${j.c ?? '—'} | ${label[j.st]} |`)
].join('\n'), 'snapshot');
function copyToast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1300); }
function copy(text, what) { navigator.clipboard?.writeText(text).catch(() => {}); copyToast('copied · ' + (what || text)); }

/* ================= mock live data ================= */
setInterval(() => {
  for (const j of joints) if (j.pos != null && j.st !== 'idle' && Math.random() < .4) j.pos += Math.round((Math.random() - .5) * 6);
  renderJoints(); if (page === 'tools' && tool === 'calib') renderTool();
}, 2000);
let tk = 0;
setInterval(() => {
  tk++;
  imu.roll = 2.1 + Math.sin(tk / 6) * .6; imu.pitch = -.4 + Math.cos(tk / 5) * .4; imu.yaw = 12 + Math.sin(tk / 9) * .3;
  for (const k in hist) { hist[k].push(imu[k]); hist[k].shift(); }
  renderImu(); update3d();
  if (connected) {
    rawLines.push([now(), `{"type":"imu","roll":${imu.roll.toFixed(2)},"pitch":${imu.pitch.toFixed(2)},"yaw":${imu.yaw.toFixed(2)}}`]);
    if (tk % 4 === 0) rawLines.push([now(), `{"type":"servo","id":13,"position_raw":${joints[2].pos},"voltage_v":7.3,"temperature_c":58}`]);
    if (rawLines.length > 500) rawLines.splice(0, rawLines.length - 500);
    if (tab === 'serial') renderStream();
  }
}, 500);

renderJoints(); renderImu(); update3d(); renderStream(); renderActs();
go(new URLSearchParams(location.search).get('page') || 'monitor');
</script>
