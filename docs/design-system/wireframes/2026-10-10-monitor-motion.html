<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS wireframe</title>
<!--
  Wireframe v0 (2026-10-10). Layout and behaviour only.
  - Colours: palette 04 "Cognac" (docs/design-system/README.md)
  - Type: placeholder (system sans / system mono)
  - Robot: 2D placeholder for the orbitable 3D view
  - All values are mock.
-->
<style>
  :root {
    --bg:#141110; --surface:#1c1816; --line:#2c2622; --line-strong:#40382f;
    --t1:#ede6dc; --t2:#aba196; --t3:#6f665d;
    --accent:#c08254; --on-accent:#141110;
    --ok:#9aae86; --warn:#d9b45f; --fault:#c9473f; --off:#6f665d;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--t1); font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  .app { height: 100vh; display: grid; grid-template-rows: 48px 1fr 168px; }

  /* top bar */
  .top { display: flex; align-items: center; gap: 32px; padding: 0 24px; border-bottom: 1px solid var(--line); }
  .brand { letter-spacing: .28em; font-size: 12px; }
  .nav { display: flex; gap: 4px; }
  .nav button { padding: 14px 12px; color: var(--t3); border-bottom: 1px solid transparent; font-size: 12px; }
  .nav button.on { color: var(--t1); border-bottom-color: var(--accent); }
  .sp { flex: 1; }
  .src { font-size: 11px; color: var(--t2); letter-spacing: .06em; }
  .sys { font-size: 13px; letter-spacing: .12em; display: flex; gap: 8px; align-items: center; padding-left: 20px; border-left: 1px solid var(--line); height: 100%; }
  .sq { width: 8px; height: 8px; display: inline-block; }
  .copyall { font-size: 11px; color: var(--t2); border: 1px solid var(--line-strong); padding: 5px 10px; letter-spacing: .06em; }
  .copyall:hover { color: var(--t1); }

  /* stage */
  .stage { display: grid; grid-template-columns: 1fr minmax(360px, 1.3fr) 1fr; min-height: 0; }
  body.motion .stage { grid-template-columns: 1fr minmax(320px, 1.1fr) 1fr 280px; }
  .leg { padding: 28px 24px; display: flex; flex-direction: column; gap: 4px; }
  .leg.r { border-left: 1px solid var(--line); }
  .leg.l { border-right: 1px solid var(--line); }
  .leghead { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .14em; color: var(--t3); text-transform: uppercase; margin-bottom: 12px; }
  .joint { padding: 14px 0 14px 12px; border-bottom: 1px solid var(--line); border-left: 2px solid transparent; cursor: pointer; }
  .joint.sel { border-left-color: var(--accent); background: var(--surface); }
  .joint .nm { display: flex; justify-content: space-between; font-size: 11px; color: var(--t2); letter-spacing: .04em; padding-right: 12px; }
  .joint .nm .id { color: var(--t3); }
  .vals { display: grid; grid-template-columns: 1.3fr 1fr 1fr; margin-top: 6px; padding-right: 12px; }
  .v { font-size: 20px; font-weight: 300; }
  .v small { font-size: 10px; color: var(--t3); margin-left: 3px; }
  .v.dim { color: var(--t3); }
  .st { font-size: 10px; letter-spacing: .1em; display: flex; gap: 6px; align-items: center; }
  .st .sq { width: 6px; height: 6px; }

  .center { position: relative; display: grid; place-items: center; }
  .center .tag { position: absolute; top: 20px; left: 24px; font-size: 10px; letter-spacing: .14em; color: var(--t3); text-transform: uppercase; }
  .center .view { position: absolute; top: 20px; right: 24px; font-size: 10px; color: var(--t3); }
  .center .attitude { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 28px; font-size: 12px; color: var(--t2); }
  .attitude b { font-weight: 400; color: var(--t1); }
  #robot { width: min(90%, 380px); height: auto; }
  .facing { position: absolute; bottom: 48px; font-size: 10px; color: var(--t3); letter-spacing: .1em; }

  /* motion rail */
  .rail { display: none; border-left: 1px solid var(--line); flex-direction: column; }
  body.motion .rail { display: flex; }
  .rail .sec { padding: 20px; border-bottom: 1px solid var(--line); }
  .label { font-size: 10px; letter-spacing: .14em; color: var(--t3); text-transform: uppercase; margin-bottom: 10px; }
  .prog button { display: block; width: 100%; text-align: left; padding: 8px 10px; color: var(--t2); border-left: 2px solid transparent; }
  .prog button.on { color: var(--t1); border-left-color: var(--accent); background: var(--surface); }
  .line1 { font-size: 11px; color: var(--t2); }
  .acts { display: flex; flex-direction: column; gap: 8px; }
  .act { border: 1px solid var(--line-strong); padding: 14px 12px; text-align: left; display: flex; justify-content: space-between; align-items: center; }
  .act:hover:not(:disabled) { border-color: var(--accent); }
  .act:disabled { color: var(--t3); cursor: not-allowed; }
  .act .why { font-size: 10px; color: var(--t3); }
  .act.running { border-color: var(--accent); color: var(--accent); }
  .stop { margin: auto 20px 20px; padding: 18px; background: var(--fault); color: var(--bg); letter-spacing: .2em; font-size: 14px; display: flex; justify-content: space-between; }
  .stop kbd { font: 10px var(--mono); opacity: .7; letter-spacing: 0; }

  /* bottom strip */
  .strip { display: grid; grid-template-columns: 280px 1fr 1.4fr; border-top: 1px solid var(--line); }
  .strip > div { padding: 18px 24px; min-width: 0; }
  .strip > div + div { border-left: 1px solid var(--line); }
  .level { display: grid; grid-template-columns: 112px 1fr; gap: 20px; align-items: center; }
  .rows div { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; color: var(--t2); }
  .rows b { font-weight: 400; color: var(--t1); }
  .big { font-size: 28px; font-weight: 300; }
  .big small { font-size: 12px; color: var(--t3); margin-left: 4px; }
  .bus { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: end; }
  .bus svg { width: 100%; height: 72px; }
  .ev { display: grid; grid-template-columns: 64px 1fr; gap: 12px; font-size: 11px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .ev .t { color: var(--t3); }
  .ev .m { color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  [data-copy] { cursor: copy; }
  [data-copy]:hover { color: var(--accent); }
  .toast { position: fixed; bottom: 184px; left: 50%; transform: translateX(-50%); background: var(--t1); color: var(--bg); font: 11px var(--mono); padding: 6px 12px; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .toast.show { opacity: 1; }

  .wf-note { position: fixed; right: 8px; bottom: 4px; font: 10px var(--mono); color: var(--t3); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="brand">NEXUS</span>
    <nav class="nav">
      <button class="on" data-page="monitor">Monitor</button>
      <button data-page="motion">Motion</button>
      <button>Logs</button>
      <button>Tools</button>
    </nav>
    <span class="sp"></span>
    <button class="copyall mono" id="copyall">COPY ALL</button>
    <span class="src mono">DEVICE · LIVE · 00:14:32</span>
    <span class="sys mono" id="sys" style="color:var(--fault)"><i class="sq" style="background:var(--fault)"></i>ERROR</span>
  </header>

  <main class="stage">
    <!-- Front view: the robot's RIGHT leg is on the screen's LEFT. -->
    <section class="leg l" id="legR"></section>

    <section class="center">
      <span class="tag">Robot</span>
      <span class="view mono">3D · drag to orbit</span>
      <svg id="robot" viewBox="0 0 300 340"></svg>
      <span class="facing mono">FRONT VIEW</span>
      <div class="attitude mono">
        <span>roll <b data-copy="roll +2.1°">+2.1°</b></span>
        <span>pitch <b data-copy="pitch −0.4°">−0.4°</b></span>
        <span>yaw <b data-copy="yaw 12.0°">12.0°</b></span>
      </div>
    </section>

    <section class="leg r" id="legL"></section>

    <aside class="rail">
      <div class="sec">
        <div class="label">Motion</div>
        <div class="prog" id="prog">
          <button class="on" data-p="squat">屈伸</button>
          <button data-p="left">左脚 平面リンク</button>
          <button data-p="right">右脚 平面リンク</button>
        </div>
      </div>
      <div class="sec">
        <div class="line1 mono" id="mstate">READY · ID 12 13 22 23</div>
      </div>
      <div class="sec">
        <div class="acts" id="acts"></div>
      </div>
      <button class="stop mono" id="stop">STOP <kbd>esc</kbd></button>
    </aside>
  </main>

  <footer class="strip">
    <div class="level">
      <svg viewBox="0 0 112 112" width="112" height="112">
        <circle cx="56" cy="56" r="54" fill="none" stroke="var(--line-strong)"/>
        <circle cx="56" cy="56" r="18" fill="none" stroke="var(--line)"/>
        <line x1="2" y1="56" x2="110" y2="56" stroke="var(--line)"/>
        <line x1="56" y1="2" x2="56" y2="110" stroke="var(--line)"/>
        <circle cx="64" cy="54" r="7" fill="var(--t1)"/>
      </svg>
      <div>
        <div class="label">Level</div>
        <div class="rows mono">
          <div>roll <b data-copy="roll +2.1°">+2.1°</b></div>
          <div>pitch <b data-copy="pitch −0.4°">−0.4°</b></div>
          <div>accuracy <b>HIGH</b></div>
        </div>
      </div>
    </div>
    <div>
      <div class="label">Bus voltage · 60 s</div>
      <div class="bus">
        <div class="big mono" data-copy="bus 7.38 V">7.38<small>V</small></div>
        <svg viewBox="0 0 240 72" preserveAspectRatio="none">
          <line x1="0" y1="20" x2="240" y2="20" stroke="var(--line)" stroke-dasharray="2 3"/>
          <polyline fill="none" stroke="var(--accent)" stroke-width="1.25" points="0,34 12,33 24,35 36,34 48,32 60,34 72,37 84,38 96,36 108,35 120,39 132,42 144,40 156,38 168,39 180,37 192,38 204,40 216,39 228,38 240,39"/>
        </svg>
      </div>
    </div>
    <div>
      <div class="label">Events</div>
      <div class="mono" id="events"></div>
    </div>
  </footer>
</div>
<div class="toast" id="toast"></div>
<span class="wf-note">wireframe v0 · mock data</span>

<script>
const S = { ok:'var(--ok)', hot:'var(--warn)', fault:'var(--fault)', idle:'var(--off)' };
const joints = [
  { id:11, leg:'L', name:'YAW',   pos:2048, v:7.4, c:34, st:'ok' },
  { id:12, leg:'L', name:'UPPER', pos:1873, v:7.4, c:36, st:'ok' },
  { id:13, leg:'L', name:'KNEE',  pos:2311, v:7.3, c:58, st:'hot' },
  { id:21, leg:'R', name:'YAW',   pos:2050, v:7.4, c:33, st:'ok' },
  { id:22, leg:'R', name:'UPPER', pos:null, v:null, c:null, st:'fault' },
  { id:23, leg:'R', name:'KNEE',  pos:1790, v:7.4, c:35, st:'idle' },
];
const label = { ok:'OK', hot:'HOT', fault:'NO REPLY', idle:'IDLE' };
let selected = 12;

function legHTML(leg, title) {
  return `<div class="leghead"><span>${title}</span><span class="mono">pos · V · °C</span></div>` +
    joints.filter(j => j.leg === leg).map(j => {
      const d = x => x == null ? '<span class="v dim mono">—</span>' : '';
      const val = (x, u) => x == null ? d(x) : `<span class="v mono" data-copy="ID ${j.id} ${x}${u ? ' ' + u : ''}">${x}${u ? `<small>${u}</small>` : ''}</span>`;
      const temp = j.c == null ? d(j.c) : `<span class="v mono" style="${j.st==='hot'?'color:var(--warn)':''}" data-copy="ID ${j.id} ${j.c} °C">${j.c}<small>°C</small></span>`;
      return `<div class="joint ${j.id===selected?'sel':''}" data-id="${j.id}">
        <div class="nm mono"><span><span class="id">${j.id}</span>&nbsp; ${j.name}</span>
          <span class="st" style="color:${S[j.st]}"><i class="sq" style="background:${S[j.st]}"></i>${label[j.st]}</span></div>
        <div class="vals">${val(j.pos,'')}${val(j.v,'V')}${temp}</div></div>`;
    }).join('');
}

function drawRobot(rollDeg) {
  // Front view placeholder. Screen-left = robot RIGHT.
  const col = id => S[joints.find(j => j.id === id).st];
  const ring = id => id === selected ? `stroke="var(--accent)" stroke-width="2"` : `stroke="none"`;
  const leg = (x, ids, side) => `
    <line x1="${x}" y1="80" x2="${x}" y2="300" stroke="var(--line-strong)" stroke-width="10" stroke-linecap="square"/>
    <rect x="${x-26}" y="298" width="52" height="8" fill="var(--line-strong)"/>
    ${[[ids[0],100],[ids[1],150],[ids[2],225]].map(([id,y]) =>
      `<circle cx="${x}" cy="${y}" r="11" fill="var(--bg)" ${ring(id)}/>
       <circle cx="${x}" cy="${y}" r="6" fill="${col(id)}"/>
       <text x="${side==='R'?x-22:x+22}" y="${y+4}" fill="var(--t3)" font-family="ui-monospace,Menlo" font-size="10" text-anchor="${side==='R'?'end':'start'}">${id}</text>`).join('')}`;
  document.getElementById('robot').innerHTML = `
    <line x1="20" y1="306" x2="280" y2="306" stroke="var(--line)" stroke-dasharray="3 4"/>
    <g transform="rotate(${rollDeg} 150 306)">
      <rect x="80" y="60" width="140" height="24" fill="none" stroke="var(--line-strong)" stroke-width="2"/>
      ${leg(105, [21,22,23], 'R')}
      ${leg(195, [11,12,13], 'L')}
      <text x="105" y="330" fill="var(--t3)" font-family="ui-monospace,Menlo" font-size="10" text-anchor="middle">R</text>
      <text x="195" y="330" fill="var(--t3)" font-family="ui-monospace,Menlo" font-size="10" text-anchor="middle">L</text>
    </g>`;
}

const events = [
  ['14:32:08', 'ID 22 no reply', 'fault'],
  ['14:31:50', 'ID 13 temp 58 °C', 'hot'],
  ['14:18:02', 'scan started', ''],
  ['14:17:59', 'serial attached', ''],
];
function renderEvents() {
  document.getElementById('events').innerHTML = events.slice(0, 5).map(([t, m, s]) =>
    `<div class="ev"><span class="t">${t}</span><span class="m" style="${s?`color:${S[s]}`:''}" data-copy="${t} ${m}">${m}</span></div>`).join('');
}

function render() {
  document.getElementById('legR').innerHTML = legHTML('R', 'Right leg');
  document.getElementById('legL').innerHTML = legHTML('L', 'Left leg');
  drawRobot(2.1);
  renderEvents();
}

/* ---- motion rail ---- */
const programs = {
  squat: { ids:'12 13 22 23', acts:['しゃがむ','立つ'] },
  left:  { ids:'12 13', acts:['A方向へ','中立へ'] },
  right: { ids:'22 23', acts:['A方向へ','中立へ'] },
};
let prog = 'squat', running = null;
const blocked = () => {
  const bad = joints.find(j => j.st === 'fault' && programs[prog].ids.split(' ').includes(String(j.id)));
  return bad ? `ID ${bad.id} 応答なし` : null;
};
function renderActs() {
  const p = programs[prog], why = running ? '動作中' : blocked();
  document.getElementById('mstate').textContent = (running ? 'MOVING' : why ? 'BLOCKED' : 'READY') + ' · ID ' + p.ids;
  document.getElementById('acts').innerHTML = p.acts.map(a =>
    `<button class="act ${running===a?'running':''}" ${why?'disabled':''} data-a="${a}">${a}${why && running!==a ? `<span class="why mono">${why}</span>` : ''}</button>`).join('');
}
document.getElementById('prog').onclick = e => {
  const b = e.target.closest('button'); if (!b || running) return;
  prog = b.dataset.p;
  document.querySelectorAll('#prog button').forEach(x => x.classList.toggle('on', x === b));
  renderActs();
};
document.getElementById('acts').onclick = e => {
  const b = e.target.closest('.act'); if (!b || b.disabled) return;
  running = b.dataset.a; renderActs();
  log(`${running} start`);
  setTimeout(() => { if (running) { log(`${running} done`); running = null; renderActs(); } }, 1800);
};
function stop() { if (running) { running = null; renderActs(); } log('STOP', 'fault'); }
document.getElementById('stop').onclick = stop;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('motion')) stop(); });

function log(m, s = '') {
  events.unshift([new Date().toTimeString().slice(0, 8), m, s]); renderEvents();
}

/* ---- nav ---- */
document.querySelectorAll('.nav button[data-page]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.nav button').forEach(x => x.classList.toggle('on', x === b));
  document.body.classList.toggle('motion', b.dataset.page === 'motion');
});

/* ---- selection + copy ---- */
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) { copy(c.dataset.copy); return; }
  const j = e.target.closest('.joint');
  if (j) { selected = +j.dataset.id; render(); }
});
document.getElementById('copyall').onclick = () => {
  const rows = joints.map(j => `| ${j.leg === 'L' ? 'LEFT' : 'RIGHT'}_${j.name} | ${j.id} | ${j.pos ?? '—'} | ${j.v ?? '—'} | ${j.c ?? '—'} | ${label[j.st]} |`);
  copy([`NEXUS ${new Date().toISOString().slice(0,19).replace('T',' ')} · DEVICE LIVE · ERROR`,
        `IMU  roll +2.1°  pitch −0.4°  yaw 12.0°   bus 7.38 V`, '',
        '| joint | id | pos | V | °C | status |', '|---|---|---|---|---|---|', ...rows].join('\n'), 'snapshot');
};
function copy(text, what) {
  navigator.clipboard?.writeText(text).catch(() => {});
  const t = document.getElementById('toast');
  t.textContent = 'copied · ' + (what || text);
  t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1200);
}

render(); renderActs();
</script>
</body>
</html>
