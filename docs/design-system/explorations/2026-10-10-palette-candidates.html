<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS palette candidates</title>
<!--
  Exploration only (2026-10-10). Not a design-system source of truth.
  Type is a placeholder (system sans + system mono); typography is decided later.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0c0c0b; color: #d8d6d0;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    padding: 48px 40px 96px;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .page-head { max-width: 1120px; margin: 0 auto 56px; }
  .page-head h1 { font-size: 13px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
  .page-head p { color: #8a877f; margin-top: 8px; max-width: 640px; }

  section.cand {
    max-width: 1120px; margin: 0 auto 72px;
    background: var(--bg); color: var(--t1);
    border: 1px solid var(--line);
  }
  .cand-head { display: grid; grid-template-columns: 56px 1fr auto; gap: 24px; padding: 28px 32px 24px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .cand-head .no { color: var(--t3); }
  .cand-head h2 { font-size: 18px; font-weight: 500; letter-spacing: .02em; }
  .cand-head .ja { color: var(--t2); margin-left: 10px; font-size: 13px; }
  .cand-head .concept { color: var(--t2); margin-top: 6px; max-width: 560px; }

  .swatches { display: grid; grid-template-columns: repeat(10, 1fr); border-bottom: 1px solid var(--line); }
  .sw { padding: 12px 12px 10px; border-right: 1px solid var(--line); }
  .sw:last-child { border-right: 0; }
  .chip { height: 40px; border: 1px solid var(--line); margin-bottom: 8px; }
  .sw .k { color: var(--t3); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  .sw .v { color: var(--t2); font-size: 11px; }

  /* mock screen */
  .screen { display: grid; grid-template-columns: 168px 1fr; min-height: 420px; }
  .nav { border-right: 1px solid var(--line); padding: 20px 0; }
  .brand { padding: 0 20px 20px; font-size: 12px; letter-spacing: .24em; color: var(--t1); }
  .nav a { display: block; padding: 7px 20px; color: var(--t3); text-decoration: none; font-size: 12px; border-left: 2px solid transparent; }
  .nav a.on { color: var(--t1); border-left-color: var(--accent); }
  .nav a.off { color: var(--t3); opacity: .55; }

  .main { display: grid; grid-template-rows: auto 1fr; }
  .bar { display: flex; gap: 28px; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--t2); }
  .bar .k { color: var(--t3); margin-right: 8px; letter-spacing: .08em; text-transform: uppercase; font-size: 10px; }
  .bar .sp { flex: 1; }
  .state { display: inline-flex; align-items: center; gap: 6px; letter-spacing: .08em; }
  .dot { width: 6px; height: 6px; display: inline-block; }
  .btn { border: 1px solid var(--line-strong); padding: 5px 12px; color: var(--t1); font-size: 11px; letter-spacing: .06em; background: transparent; }
  .btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  .body { display: grid; grid-template-columns: 1fr 300px; }
  .joints { padding: 20px 24px; border-right: 1px solid var(--line); }
  .label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--t3); margin-bottom: 12px; display: flex; justify-content: space-between; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-weight: 400; font-size: 10px; letter-spacing: .08em; color: var(--t3); padding: 6px 8px; border-bottom: 1px solid var(--line); text-transform: uppercase; }
  th.r, td.r { text-align: right; }
  td { padding: 9px 8px; border-bottom: 1px solid var(--line); color: var(--t1); }
  td.id { color: var(--t3); }
  tr.sel td { background: var(--surface); }
  tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
  td.dim { color: var(--t3); }
  .tag { font-size: 10px; letter-spacing: .08em; display: inline-flex; gap: 6px; align-items: center; }

  .side { display: grid; grid-template-rows: auto 1fr; }
  .chart { padding: 20px 24px; border-bottom: 1px solid var(--line); }
  .big { font-size: 28px; font-weight: 300; letter-spacing: -.01em; }
  .big small { font-size: 12px; color: var(--t3); margin-left: 4px; }
  svg { display: block; width: 100%; height: 64px; margin-top: 10px; }
  .log { padding: 20px 24px; }
  .ev { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 6px 0; font-size: 11px; border-bottom: 1px solid var(--line); }
  .ev .t { color: var(--t3); }
  .ev .m { color: var(--t2); }

  .notes { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
  .notes div { padding: 18px 32px; color: var(--t2); font-size: 12px; }
  .notes div + div { border-left: 1px solid var(--line); }
  .notes b { display: block; font-weight: 500; color: var(--t3); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }

  /* ---- candidates ---- */
  .c1 { --bg:#131210; --surface:#1b1a17; --line:#292723; --line-strong:#3d3a35;
        --t1:#ece8df; --t2:#a9a49a; --t3:#6e6a62;
        --accent:#ece8df; --on-accent:#131210;
        --ok:#9dae8a; --warn:#c9a45c; --fault:#c8553d; --off:#6e6a62; }
  .c2 { --bg:#121310; --surface:#1a1c17; --line:#292c25; --line-strong:#3b3f35;
        --t1:#e4e2d6; --t2:#a3a396; --t3:#6b6c61;
        --accent:#b9ae85; --on-accent:#121310;
        --ok:#8fa874; --warn:#d0a25a; --fault:#c65a44; --off:#6b6c61; }
  .c3 { --bg:#0f1114; --surface:#161a1f; --line:#232930; --line-strong:#353d47;
        --t1:#e6e6e2; --t2:#a0a4a8; --t3:#646a71;
        --accent:#8fa6c8; --on-accent:#0f1114;
        --ok:#93ae8c; --warn:#d2a75e; --fault:#cc5b4b; --off:#646a71; }
  .c4 { --bg:#141110; --surface:#1c1816; --line:#2c2622; --line-strong:#40382f;
        --t1:#ede6dc; --t2:#aba196; --t3:#6f665d;
        --accent:#c08254; --on-accent:#141110;
        --ok:#9aae86; --warn:#d9b45f; --fault:#c9473f; --off:#6f665d; }
</style>
</head>
<body>

<header class="page-head">
  <h1>NEXUS — palette candidates</h1>
  <p>2026-10-10。参考画像（ノームコアの服、シックなWeb）から拾った4案です。どの案も「暗い無彩色の土台 ＋ アクセント1色 ＋ 状態色4色」という同じ構造で、変えているのは色の温度とアクセントだけです。フォントは仮置きです。</p>
</header>

<template id="screen">
  <div class="screen">
    <nav class="nav">
      <div class="brand">NEXUS</div>
      <a class="on">Overview</a><a>Joints</a><a>IMU</a><a>Logs</a>
      <a class="off">Replay</a><a class="off">Settings</a>
    </nav>
    <div class="main">
      <div class="bar mono">
        <span><span class="k">Source</span>DEVICE · LIVE</span>
        <span><span class="k">Uptime</span>00:14:32</span>
        <span class="state" style="color:var(--fault)"><i class="dot" style="background:var(--fault)"></i>ERROR</span>
        <span class="sp"></span>
        <button class="btn mono">Record</button>
        <button class="btn primary mono">Connect</button>
      </div>
      <div class="body">
        <div class="joints">
          <div class="label"><span>Joints</span><span class="mono">scan 2.0 s</span></div>
          <table class="mono">
            <tr><th>Joint</th><th>ID</th><th class="r">Pos</th><th class="r">V</th><th class="r">°C</th><th>Status</th></tr>
            <tr><td>LEFT_YAW</td><td class="id">11</td><td class="r">2048</td><td class="r">7.4</td><td class="r">34</td><td><span class="tag" style="color:var(--ok)"><i class="dot" style="background:var(--ok)"></i>OK</span></td></tr>
            <tr class="sel"><td>LEFT_PLANAR_UPPER</td><td class="id">12</td><td class="r">1873</td><td class="r">7.4</td><td class="r">36</td><td><span class="tag" style="color:var(--ok)"><i class="dot" style="background:var(--ok)"></i>OK</span></td></tr>
            <tr><td>LEFT_PLANAR_KNEE</td><td class="id">13</td><td class="r">2311</td><td class="r">7.3</td><td class="r" style="color:var(--warn)">58</td><td><span class="tag" style="color:var(--warn)"><i class="dot" style="background:var(--warn)"></i>HOT</span></td></tr>
            <tr><td>RIGHT_YAW</td><td class="id">21</td><td class="r">2050</td><td class="r">7.4</td><td class="r">33</td><td><span class="tag" style="color:var(--ok)"><i class="dot" style="background:var(--ok)"></i>OK</span></td></tr>
            <tr><td>RIGHT_PLANAR_UPPER</td><td class="id">22</td><td class="r dim">—</td><td class="r dim">—</td><td class="r dim">—</td><td><span class="tag" style="color:var(--fault)"><i class="dot" style="background:var(--fault)"></i>NO REPLY</span></td></tr>
            <tr><td>RIGHT_PLANAR_KNEE</td><td class="id">23</td><td class="r">1790</td><td class="r">7.4</td><td class="r">35</td><td><span class="tag" style="color:var(--off)"><i class="dot" style="background:var(--off)"></i>IDLE</span></td></tr>
          </table>
        </div>
        <div class="side">
          <div class="chart">
            <div class="label"><span>Bus voltage</span><span class="mono">60 s</span></div>
            <div class="big mono">7.38<small>V</small></div>
            <svg viewBox="0 0 240 64" preserveAspectRatio="none">
              <line x1="0" y1="16" x2="240" y2="16" stroke="var(--line)" stroke-dasharray="2 3"/>
              <polyline fill="none" stroke="var(--accent)" stroke-width="1.25"
                points="0,30 12,29 24,31 36,30 48,28 60,30 72,33 84,34 96,32 108,31 120,35 132,38 144,36 156,34 168,35 180,33 192,34 204,36 216,35 228,34 240,35"/>
            </svg>
          </div>
          <div class="log mono">
            <div class="label"><span>Events</span><span>4</span></div>
            <div class="ev"><span class="t">14:32:08</span><span class="m" style="color:var(--fault)">ID 22 no reply</span></div>
            <div class="ev"><span class="t">14:31:50</span><span class="m" style="color:var(--warn)">ID 13 temp 58 °C</span></div>
            <div class="ev"><span class="t">14:18:02</span><span class="m">scan started</span></div>
            <div class="ev"><span class="t">14:17:59</span><span class="m">serial attached</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<section class="cand c1" data-no="01" data-name="Sumi" data-ja="墨と生成り"
  data-concept="色相を持たない案。アクセントも生成りの白で、選択は『明るさ』だけで表す。最もノームコア。色が出たら必ず状態の意味。"
  data-pro="一番静かで誤読がない。状態色が際立つ。" data-con="地味さが紙一重。選択中と通常の差が明るさだけになる。"></section>

<section class="cand c2" data-no="02" data-name="Olive" data-ja="作業着のオリーブ"
  data-concept="ワークウェアのカーキ・オリーブ寄り。土台をわずかに緑に振り、アクセントはカーキ。道具・現場感。"
  data-pro="温かみと実用感。ロボットの『作業場』らしさ。" data-con="カーキ（アクセント）と緑（正常）が近く、意味が混ざりやすい。"></section>

<section class="cand c3" data-no="03" data-name="Indigo" data-ja="洗いざらしのデニム"
  data-concept="土台を青みの墨に振り、アクセントは色落ちしたインディゴ。冷静で精密、Bのピットウォール寄り。"
  data-pro="アクセントが状態色（緑・黄・赤）と一番離れていて安全。" data-con="青系はテック系UIで使われがちで、ありきたりに寄るリスク。"></section>

<section class="cand c4" data-no="04" data-name="Cognac" data-ja="レザーのコニャック"
  data-concept="古着のレザージャケットの茶。土台は温かい墨、アクセントはコニャック。いちばん個性的。"
  data-pro="他のロボットUIにはない個性。服の参考画像に一番近い。" data-con="茶色のアクセントと黄色（注意）が近く、注意色を黄寄りに逃がす必要がある。"></section>

<script>
  const tpl = document.getElementById('screen');
  document.querySelectorAll('section.cand').forEach(s => {
    const d = s.dataset;
    const cs = getComputedStyle(s);
    const keys = [['bg','--bg'],['surface','--surface'],['line','--line'],['text 1','--t1'],['text 2','--t2'],['text 3','--t3'],['accent','--accent'],['ok','--ok'],['warn','--warn'],['fault','--fault']];
    s.innerHTML = `
      <div class="cand-head">
        <span class="no mono">${d.no}</span>
        <div><h2>${d.name}<span class="ja">${d.ja}</span></h2><p class="concept">${d.concept}</p></div>
      </div>
      <div class="swatches">${keys.map(([k,v]) => {
        const val = cs.getPropertyValue(v).trim();
        return `<div class="sw"><div class="chip" style="background:${val}"></div><div class="k">${k}</div><div class="v mono">${val}</div></div>`;
      }).join('')}</div>`;
    s.appendChild(tpl.content.cloneNode(true));
    s.insertAdjacentHTML('beforeend', `<div class="notes"><div><b>良い点</b>${d.pro}</div><div><b>気になる点</b>${d.con}</div></div>`);
  });
</script>
</body>
</html>
