[platformio]
src_dir = firmware

[env]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; XIAO ESP32-S3 Sense uses octal PSRAM.
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM

[env:camera]
build_src_filter =
    -<*>
    +<xiao-esp32s3-camera-test/src/>
build_flags =
    ${env.build_flags}
    -Ifirmware/xiao-esp32s3-camera-test/include

[env:stream]
build_src_filter =
    -<*>
    +<xiao-esp32s3-camera-stream/src/>
build_flags =
    ${env.build_flags}
    -Ifirmware/xiao-esp32s3-camera-stream/include

[env:servo]
build_src_filter =
    -<*>
    +<servo-driver-test/src/>
lib_deps =
    https://github.com/workloads/scservo.git#1.0.2

[env:calibration]
build_src_filter =
    -<*>
    +<servo-calibration/src/>
lib_deps =
    https://github.com/workloads/scservo.git#1.0.2

[env:motion-nudge]
build_src_filter =
    -<*>
    +<servo-motion-nudge/src/>
lib_deps =
    https://github.com/workloads/scservo.git#1.0.2

; Retired after ID13 remount: left-planar-nudge, phase1-left-planar-imu,
; phase1-planar-imu. Sources are historical; their targets are unsafe for
; the current mounting. See docs/decisions/0014-motion-link-safety.md.

; USB-only BNO085 wiring and orientation check. This environment contains no
; servo library and never sends a servo-bus command.
[env:imu-check]
build_src_filter =
    -<*>
    +<imu-check/src/>
lib_deps =
    adafruit/Adafruit BNO08x @ ^1.2.6

; Supported six-axis motion: squat/step/walk; link timeout holds current pose.
[env:supported-squat]
build_src_filter =
    -<*>
    +<supported-squat/src/>
lib_deps =
    https://github.com/workloads/scservo.git#1.0.2
    adafruit/Adafruit BNO08x @ ^1.2.6
